# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
---
ludus:
  - vm_name: "{{ range_id }}-dc01"
    hostname: DC01
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: false
    domain:
      fqdn: ludus.domain
      role: primary-dc

  - vm_name: "{{ range_id }}-proxy"
    hostname: proxy
    template: debian-13-x64-server-template
    vlan: 10
    ip_last_octet: 20
    ram_gb: 2
    cpus: 2
    linux: true
    roles:
      - ludus_spnego
    role_vars:
      spnego_mode: proxy

  - vm_name: "{{ range_id }}-ws01"
    hostname: WS01
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 30
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: false
    domain:
      fqdn: ludus.domain
      role: member
    roles:
      - name: ludus_spnego
        depends_on:
          - vm_name: "{{ range_id }}-proxy"
            role: ludus_spnego
    role_vars:
      spnego_mode: client

network:
  inter_vlan_default: ACCEPT
  external_default: REJECT
  rules:
    - name: Allow only Squid to reach external networks
      vlan_src: 10
      ip_last_octet_src: 20
      vlan_dst: public
      protocol: all
      ports: all
      action: ACCEPT
