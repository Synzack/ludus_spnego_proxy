---
- name: Locate the primary domain controller in the range
  ansible.builtin.set_fact:
    spnego_dc_entry: >-
      {{ ludus
         | selectattr('domain', 'defined')
         | selectattr('domain.role', 'equalto', 'primary-dc')
         | first }}

- name: Derive the domain and Kerberos settings
  ansible.builtin.set_fact:
    spnego_dc_ip: "{{ hostvars[spnego_dc_entry.vm_name].ansible_host }}"
    spnego_dc_fqdn: "{{ spnego_dc_entry.hostname | lower }}.{{ spnego_dc_entry.domain.fqdn | lower }}"
    spnego_domain: "{{ spnego_dc_entry.domain.fqdn | lower }}"
    spnego_realm: "{{ spnego_dc_entry.domain.fqdn | upper }}"
    spnego_effective_proxy_fqdn: >-
      {{ spnego_proxy_fqdn if (spnego_proxy_fqdn | length > 0)
         else (spnego_proxy_hostname | lower) ~ '.' ~ (spnego_dc_entry.domain.fqdn | lower) }}

- name: Install Squid, Kerberos, keytab, DNS, and PAC dependencies
  ansible.builtin.apt:
    name:
      - squid
      - krb5-user
      - msktutil
      - libsasl2-modules-gssapi-mit
      - dnsutils
      - nginx-light
      - python3-pexpect
    state: present
    update_cache: true
  become: true

- name: Make the DC and proxy FQDNs resolvable during provisioning
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} LUDUS SPNEGO PROXY"
    block: |
      {{ spnego_dc_ip }} {{ spnego_dc_fqdn }} {{ spnego_dc_entry.hostname | lower }}
      {{ ansible_host }} {{ spnego_effective_proxy_fqdn }} {{ spnego_effective_proxy_fqdn.split('.')[0] }}
  become: true

- name: Configure the Kerberos realm
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Obtain a domain administrator Kerberos ticket
  ansible.builtin.expect:
    command: "/usr/bin/kinit {{ defaults.ad_domain_admin }}@{{ spnego_realm }}"
    responses:
      "(?i)password.*:": "{{ defaults.ad_domain_admin_password }}"
  become: true
  no_log: true

- name: Register the proxy's DNS A record in AD
  ansible.builtin.command: /usr/bin/nsupdate -g
  args:
    stdin: |
      server {{ spnego_dc_fqdn }}
      zone {{ spnego_domain }}
      update delete {{ spnego_effective_proxy_fqdn }}. A
      update add {{ spnego_effective_proxy_fqdn }}. 300 A {{ ansible_host }}
      send
  become: true
  changed_when: true

- name: Create the AD proxy account, HTTP SPN, and service keytab
  ansible.builtin.command:
    argv:
      - /usr/sbin/msktutil
      - --create
      - --user-creds-only
      - --base
      - CN=Computers
      - --computer-name
      - "{{ spnego_computer_name }}"
      - --hostname
      - "{{ spnego_effective_proxy_fqdn }}"
      - --service
      - "HTTP/{{ spnego_effective_proxy_fqdn }}"
      - --upn
      - "HTTP/{{ spnego_effective_proxy_fqdn }}"
      - --keytab
      - /etc/squid/HTTP.keytab
      - --server
      - "{{ spnego_dc_fqdn }}"
      - --no-reverse-lookups
      - --enctypes
      - "0x1c"
  args:
    creates: /etc/squid/HTTP.keytab
  become: true

- name: Allow the Squid worker to read the keytab
  ansible.builtin.file:
    path: /etc/squid/HTTP.keytab
    owner: proxy
    group: proxy
    mode: "0400"
  become: true

- name: Install the minimal authenticated Squid configuration
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart Squid

- name: Validate the Squid configuration
  ansible.builtin.command: /usr/sbin/squid -k parse
  become: true
  changed_when: false

- name: Install the PAC file
  ansible.builtin.template:
    src: proxy.pac.j2
    dest: /var/www/html/proxy.pac
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart nginx

- name: Configure nginx's PAC listener
  ansible.builtin.template:
    src: nginx-pac.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart nginx

- name: Enable the proxy and PAC services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - squid
    - nginx
  become: true

- name: Drop the temporary administrator ticket
  ansible.builtin.command: /usr/bin/kdestroy
  become: true
  changed_when: false
